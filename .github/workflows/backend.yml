name: backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        env:
          BIFROST_ADMIN_USERNAME: admin
          BIFROST_ADMIN_PASSWORD: ci-admin-pass
          BIFROST_JWT_SECRET: ci-secret-bifrost-at-least-32-characters!!
          BIFROST_LLM_STUB_WHEN_MISSING_KEY: "true"
        run: ./mvnw -B verify
