spring:
  application:
    name: bifrost-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bifrost}
    username: ${POSTGRES_USER:bifrost}
    password: ${POSTGRES_PASSWORD:bifrost}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [corr=%X{correlationId}]"

bifrost:
  cors:
    allowed-origins: ${BIFROST_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
