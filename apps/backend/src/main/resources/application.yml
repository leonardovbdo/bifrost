spring:
  application:
    name: bifrost-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bifrost}
    username: ${POSTGRES_USER:bifrost}
    password: ${POSTGRES_PASSWORD:bifrost}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [corr=%X{correlationId}]"

bifrost:
  jwt:
    secret: ${BIFROST_JWT_SECRET:}
    access-ttl: ${BIFROST_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${BIFROST_JWT_REFRESH_TTL:7d}
  cookie:
    access-name: BIFROST_ACCESS
    refresh-name: BIFROST_REFRESH
    same-site: Lax
    secure: ${BIFROST_COOKIE_SECURE:false}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  admin:
    enabled: ${BIFROST_ADMIN_SEED_ENABLED:true}
    username: ${BIFROST_ADMIN_USERNAME:}
    password: ${BIFROST_ADMIN_PASSWORD:}
  operator:
    enabled: ${BIFROST_OPERATOR_SEED_ENABLED:false}
    username: ${BIFROST_OPERATOR_USERNAME:}
    password: ${BIFROST_OPERATOR_PASSWORD:}
  viewer:
    enabled: ${BIFROST_VIEWER_SEED_ENABLED:false}
    username: ${BIFROST_VIEWER_USERNAME:}
    password: ${BIFROST_VIEWER_PASSWORD:}
  teleop:
    linear-max: 0.5
    angular-max: 1.0
    profile: normal
  audit:
    retention-days: ${BIFROST_AUDIT_RETENTION_DAYS:90}
    purge-cron: ${BIFROST_AUDIT_PURGE_CRON:0 30 3 * * *}
    client-events:
      max-goal-pose-per-window: ${BIFROST_AUDIT_MAX_GOAL_POSE_PER_WINDOW:120}
      window: ${BIFROST_AUDIT_CLIENT_EVENTS_WINDOW:1m}
  llm:
    api-key: ${BIFROST_LLM_API_KEY:}
    model: ${BIFROST_LLM_MODEL:gemini-3.6-flash}
    base-url: ${BIFROST_LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    max-prompt-length: ${BIFROST_LLM_MAX_PROMPT_LENGTH:4000}
    timeout-ms: ${BIFROST_LLM_TIMEOUT_MS:30000}
    stub-when-missing-key: ${BIFROST_LLM_STUB_WHEN_MISSING_KEY:true}
    rate-limit:
      max-requests: ${BIFROST_LLM_RATE_LIMIT_MAX:30}
      window: ${BIFROST_LLM_RATE_LIMIT_WINDOW:1m}
